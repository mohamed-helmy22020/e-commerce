services:
  redis:
    image: redis:latest
    container_name: my-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # Use an environment variable for the password instead of hardcoding in command
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      # Use the same env var in the healthcheck
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: my-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  kafka:
    image: apache/kafka:4.3.1
    container_name: node-microservices-kafka
    ports:
      - "127.0.0.1:9092:9092"
    networks:
      - app-network
    volumes:
      - kafka-data:/var/lib/kafka/data
volumes:
  redis-data:
  postgres-data:
  kafka-data:

networks:
  app-network:
    driver: bridge